[project]
name = "aimarket-playground"
version = "0.1.0"
description = "Guided AIMarket first-invoke playground"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["cryptography>=44", "fastapi>=0.115", "httpx>=0.27", "pydantic>=2.9", "uvicorn>=0.30"]

[project.urls]
Documentation = "https://github.com/alexar76/aimarket-playground#readme"
Issues = "https://github.com/alexar76/aimarket-playground/issues"
Repository = "https://github.com/alexar76/aimarket-playground"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=playground --cov-branch --cov-report=term-missing --cov-fail-under=95"
